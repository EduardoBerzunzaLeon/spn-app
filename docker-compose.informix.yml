services:
  informix:
    image: icr.io/informix/informix-developer-database:latest
    container_name: informix_db
    hostname: informix
    restart: unless-stopped
    privileged: true

    ports:
      - "9088:9088"   # DRDA / ODBC / JDBC
      - "9089:9089"   # REST API (si aplica)
      - "27017:27017"
      - "27018:27018"

    volumes:
      - informix_data:/opt/ibm/informix/data
      - ./backups:/opt/ibm/informix/backups

    environment:
      LICENSE: accept
      INFORMIXSERVER: informix
      ONCONFIG: onconfig.std
      INFORMIXDIR: /opt/ibm/informix

      # ⚠️ IMPORTANTE: NO fijar DBNAME en producción
      # DBNAME: mi_db   ❌ NO recomendado aquí

      DB_LOCALE: en_US.819
      CLIENT_LOCALE: en_US.819

      # 🔥 CRÍTICO para ODBC / Node / DRDA
      DELIMIDENT: Y

    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'SELECT 1 FROM systables WHERE tabid=1' | dbaccess sysmaster -"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    networks:
      - informix-network

volumes:
  informix_data:

networks:
  informix-network:
    driver: bridge